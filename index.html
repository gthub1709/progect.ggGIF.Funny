<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Смешные гифки на весь экран</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }

        body {
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            animation: changeBackground 40s infinite;
        }

        @keyframes changeBackground {
            0% {
                background-image: url('https://media.giphy.com/media/13CoXDiaCcCoyk/giphy.gif');
            }
            16.6% {
                background-image: url('https://media.giphy.com/media/l0MYt5jPR6QX5pnqM/giphy.gif');
            }
            33.3% {
                background-image: url('https://media.giphy.com/media/3o6ZtpxSZbQRRnwCKQ/giphy.gif');
            }
            50% {
                background-image: url('https://media.giphy.com/media/26gsspf0C9Krb3o5u/giphy.gif');
            }
            66.6% {
                background-image: url('https://media.giphy.com/media/3o7aD2saalBwwftBIY/giphy.gif');
            }
            83.3% {
                background-image: url('https://media.giphy.com/media/ToMjGpx9F5ktZw8qPUQ/giphy.gif');
            }
            100% {
                background-image: url('https://media.giphy.com/media/3o6ZtpxSZbQRRnwCKQ/giphy.gif');
            }
        }

        .content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            text-align: center;
            font-family: Arial, sans-serif;
            font-size: 48px;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.7);
            animation: fadeIn 3s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translate(-50%, -60%);
            }
            to {
                opacity: 1;
                transform: translate(-50%, -50%);
            }
        }
    </style>
</head>
<body>
    <div class="content">
        
    </div>
</body>
</html>
